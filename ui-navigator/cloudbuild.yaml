steps:
  # Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/ui-navigator:$SHORT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/ui-navigator:latest"
      - "."

  # Push the image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/ui-navigator:$SHORT_SHA"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/ui-navigator:latest"

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "ui-navigator"
      - "--image"
      - "gcr.io/$PROJECT_ID/ui-navigator:$SHORT_SHA"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--memory"
      - "2Gi"
      - "--timeout"
      - "300"
      - "--allow-unauthenticated"
      - "--set-env-vars"
      - "GCP_PROJECT_ID=$PROJECT_ID"

images:
  - "gcr.io/$PROJECT_ID/ui-navigator:latest"

timeout: "1200s"
